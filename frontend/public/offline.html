<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101D35">
    <title>SolveKey — Offline</title>
    <style>
      body {
        align-items: center;
        background: #F5F8FC;
        color: #172033;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(16, 29, 53, 0.08);
        max-width: 32rem;
        padding: 40px;
        text-align: center;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 24px;
        font-weight: 800;
        color: #101D35;
        margin-bottom: 24px;
      }
      .logo span {
        color: #22C7D9;
      }
      h1 {
        color: #101D35;
        font-size: 22px;
        margin-top: 0;
        margin-bottom: 12px;
      }
      p {
        color: #68758A;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .tagline {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #22C7D9;
        margin-bottom: 16px;
      }
      button {
        background: #101D35;
        color: #FFFFFF;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #172B4D;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Solve<span>Key</span></div>
      <div class="tagline">Report · Resolve · Improve</div>
      <h1>Connection Unavailable</h1>
      <p>SolveKey requires an active network connection to authenticate, submit civic reports, route issues, and sync live department updates. Please check your network and reconnect.</p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </main>
  </body>
</html>
